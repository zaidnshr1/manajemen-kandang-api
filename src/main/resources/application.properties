spring.application.name=api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/manajemen_kandang}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

spring.jpa.hibernate.ddl-auto= validate
spring.jpa.hibernate.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.cors.allowed-origins=${HOST_URL:http://localhost:4200}

app.jwt.secret=${JWT_SECRET:7250b5427e829cd731bc6650e2461b269056eea7972c2a2b0d3dccd2a90fdea4}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}